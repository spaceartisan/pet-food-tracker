<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Bowl – cat feeding log</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F3F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151B20" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Food bowl">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F5F1;
    --card: #FFFFFF;
    --ink: #1F2A33;
    --muted: #66727C;
    --line: #DDE2DC;
    --bowl: #2F6DB5;
    --kibble: #D9A02B;
    --eaten: #4F8A62;
    --danger: #B3413A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151B20; --card: #1E262D; --ink: #E8ECEF; --muted: #97A3AD;
      --line: #2F3942; --bowl: #6FA3E0; --kibble: #E8B64A; --eaten: #74B488; --danger: #E0736B;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.1rem; font-weight: 900; margin: 0; }
  h2 { font-size: 1.15rem; font-weight: 800; margin: 0 0 12px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--bowl); outline-offset: 2px; }

  /* Header / cat switcher */
  header { margin-bottom: 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .cats { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .cat-chip {
    border: 2px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 6px 14px; font-weight: 800;
  }
  .cat-chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .ghost { border: none; background: none; color: var(--muted); font-weight: 700; padding: 6px 8px; border-radius: 8px; }
  .ghost:hover { color: var(--ink); }

  /* Hero: the bowl */
  .hero {
    display: grid; grid-template-columns: minmax(180px, 260px) 1fr; gap: 20px; align-items: center;
    background: var(--card); border-radius: 22px; padding: 20px; margin-bottom: 14px;
  }
  .hero svg { width: 100%; height: auto; display: block; }
  .level { font-size: 2.6rem; font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
  .level small { font-size: 1rem; font-weight: 700; color: var(--muted); letter-spacing: 0; }
  .hero p { margin: 6px 0 0; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .btn {
    border: none; border-radius: 12px; padding: 11px 16px; font-weight: 800;
    background: var(--ink); color: var(--paper);
  }
  .btn.feed { background: var(--kibble); color: #231A05; }
  .btn.check { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.plain { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font-size: 1.35rem; font-weight: 900; }
  .stat span { color: var(--muted); font-size: 0.9rem; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--eaten); }

  section.panel { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: none; background: none; padding: 4px 10px; font-weight: 700; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--line); color: var(--ink); }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    border: none; background: none; padding: 2px 4px 6px; margin-right: 10px;
    font-size: 1.15rem; font-weight: 800; color: var(--muted);
    border-bottom: 3px solid transparent;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--kibble); }
  .tabs button:hover { color: var(--ink); }
  .panel-head { margin-bottom: 10px; }
  .chart-wrap { overflow-x: auto; }
  .chart-wrap svg { width: 100%; min-width: 420px; height: auto; display: block; }
  .legend { display: flex; gap: 14px; font-size: 0.85rem; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* History */
  .day { margin-top: 12px; }
  .day h3 { font-size: 0.9rem; font-weight: 800; color: var(--muted); margin: 0 0 4px; }
  .entry { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .entry .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .entry .txt { flex: 1; min-width: 0; }
  .entry .txt small { color: var(--muted); display: block; }
  .entry .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .entry button { border: none; background: none; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
  .entry button:hover { color: var(--ink); }
  .entry button[data-del]:hover { color: var(--danger); }
  .empty { color: var(--muted); padding: 8px 0; }

  footer { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 0.9rem; }
  .footer-note { flex-basis: 100%; text-align: center; margin: 0; }
  .backup-warn {
    flex-basis: 100%; margin: 0 0 4px; padding: 10px 14px; border-radius: 12px;
    background: var(--card); color: var(--ink); border-left: 4px solid var(--kibble);
  }

  /* Dialogs */
  dialog {
    border: none; border-radius: 18px; padding: 20px; width: min(420px, calc(100% - 32px));
    background: var(--card); color: var(--ink);
  }
  dialog { max-height: calc(100% - 32px); overflow-y: auto; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .row select { width: auto; }
  .panel-note { color: var(--muted); margin: 4px 0 0; }
  dialog::backdrop { background: rgba(10, 15, 20, 0.45); }
  label { display: block; font-weight: 700; margin-bottom: 12px; }
  label.check { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  input[type=number], input[type=text], input[type=datetime-local], select {
    display: block; width: 100%; margin-top: 4px; padding: 10px 12px;
    border: 2px solid var(--line); border-radius: 10px; background: var(--paper);
  }
  .hint { font-weight: 400; color: var(--muted); font-size: 0.88rem; display: block; }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .dialog-actions .spacer { flex: 1; }

  .welcome { text-align: center; padding: 48px 16px; }
  .welcome p { color: var(--muted); max-width: 40ch; margin: 8px auto 20px; }

  @media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 560px) {
    .hero { grid-template-columns: 1fr; text-align: center; }
    .hero svg { max-width: 220px; margin: 0 auto; }
    .actions { justify-content: center; }
  }
  @media (prefers-reduced-motion: no-preference) {
    #food { transition: y .5s ease, height .5s ease; }
  }
</style>
</head>
<body>
<main id="app"></main>

<!-- Add food -->
<dialog id="feedDlg">
  <form method="dialog" id="feedForm">
    <h2 id="feedTitle">Add food</h2>
    <label>Amount added (<span class="unit"></span>)
      <input type="number" name="amount" min="0" step="any" required inputmode="decimal">
    </label>
    <label>Left in bowl before adding (<span class="unit"></span>)
      <span class="hint">Optional. Weigh what's left first and the app works out how much was eaten.</span>
      <input type="number" name="leftover" min="0" step="any" inputmode="decimal">
    </label>
    <label class="check"><input type="checkbox" name="discard"> Threw the old food out before adding</label>
    <label>When
      <input type="datetime-local" name="time" required>
    </label>
    <div class="dialog-actions">
      <button type="button" class="btn plain" data-close>Cancel</button>
      <button type="submit" class="btn feed" id="feedSubmit">Add food</button>
    </div>
  </form>
</dialog>

<!-- Weigh leftovers -->
<dialog id="checkDlg">
  <form method="dialog" id="checkForm">
    <h2 id="checkTitle">Weigh leftovers</h2>
    <label>Food left in bowl (<span class="unit"></span>)
      <input type="number" name="remaining" min="0" step="any" required inputmode="decimal">
    </label>
    <label class="check"><input type="checkbox" name="emptied"> Threw the leftovers out afterwards</label>
    <label>When
      <input type="datetime-local" name="time" required>
    </label>
    <div class="dialog-actions">
      <button type="button" class="btn plain" data-close>Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</dialog>

<!-- Cat profile -->
<dialog id="catDlg">
  <form method="dialog" id="catForm">
    <h2 id="catDlgTitle">Add a cat</h2>
    <label>Name
      <input type="text" name="name" required maxlength="40" autocomplete="off">
    </label>
    <label>Unit
      <select name="unit">
        <option value="g">grams (g)</option>
        <option value="oz">ounces (oz)</option>
        <option value="cups">cups</option>
        <option value="pouches">pouches / cans</option>
      </select>
    </label>
    <label>Daily target (<span class="unitName">cans</span>)
      <span class="hint">Optional. Shown as a line on the charts.</span>
      <input type="number" name="target" min="0" step="any" inputmode="decimal">
    </label>
    <label>Calories per <span class="unitName">can</span> (kcal)
      <span class="hint">Optional. Printed on the label. Turns on the calorie chart.</span>
      <input type="number" name="kcal" min="0" step="any" inputmode="decimal">
    </label>
    <label>Cat's weight
      <span class="hint">Optional. Used to estimate daily calorie needs.</span>
      <div class="row">
        <input type="number" name="weight" min="0" step="any" inputmode="decimal" aria-label="Weight">
        <select name="weightUnit" aria-label="Weight unit">
          <option value="lb">lb</option>
          <option value="kg">kg</option>
        </select>
      </div>
    </label>
    <label>Day starts at
      <span class="hint">Pick a time between the last feeding of the night and the first of the morning. A 1 am feeding then counts toward the day before. Changing this recalculates all stats.</span>
      <select name="dayStart">
        <option value="0">Midnight</option>
        <option value="1">1 am</option>
        <option value="2">2 am</option>
        <option value="3">3 am</option>
        <option value="4">4 am</option>
        <option value="5">5 am</option>
        <option value="6">6 am</option>
      </select>
    </label>
    <label>Lifestyle
      <select name="factor">
        <option value="1.2">Adult, spayed or neutered</option>
        <option value="1.4">Adult, not spayed or neutered</option>
        <option value="1.0">Adult, inactive or senior</option>
        <option value="0.8">Adult, needs to lose weight</option>
        <option value="2.5">Kitten</option>
      </select>
    </label>
    <div class="dialog-actions">
      <button type="button" class="btn danger" id="deleteCatBtn" hidden>Delete cat</button>
      <span class="spacer"></span>
      <button type="button" class="btn plain" data-close>Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
  const KEY = "catfood-tracker-v1";
  const $ = (s, el = document) => el.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  // ---------- Storage ----------
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && Array.isArray(d.cats)) return d;
      }
    } catch (e) { console.warn("Could not read saved data", e); }
    return { cats: [], activeId: null, range: 14 };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { alert("Couldn't save: your browser storage may be full or disabled."); }
  }
  let state = load();
  const activeCat = () => state.cats.find(c => c.id === state.activeId) || state.cats[0] || null;

  // ---------- Helpers ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const round = n => Math.round(n * 10) / 10;
  const unitSingular = u => ({ g: "gram", oz: "ounce", cups: "cup", pouches: "pouch or can" }[u] || u);
  const unitPlural = u => ({ g: "g", oz: "oz", cups: "cups", pouches: "pouches / cans" }[u] || u);
  const unitFor = (n, unit) => round(n) === 1 ? ({ cups: "cup", pouches: "pouch" }[unit] || unit) : unit;
  const fmt = (n, cat) => `${round(n).toLocaleString()} ${unitFor(n, cat.unit)}`;
  // Each cat can have its "day" start after midnight (e.g. 3 am) so late-night feedings count toward the evening before.
  let dayStartMs = 0;
  const catDay = t => dayKey(t - dayStartMs);
  const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const toLocalInput = t => { const d = new Date(t); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
  const timeStr = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  function ago(t) {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return "just now";
    if (m < 60) return `${m} min ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h} h ${m % 60} min ago`;
    const d = Math.floor(h / 24);
    return `${d} day${d > 1 ? "s" : ""} ago`;
  }
  function dayLabel(key) {
    const today = catDay(Date.now());
    const yest = catDay(Date.now() - 864e5);
    if (key === today) return "Today";
    if (key === yest) return "Yesterday";
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
  }

  // ---------- Core calculation ----------
  // Walks events in time order, tracking the estimated amount in the bowl.
  // Eating is only known when the bowl is weighed (a "check", or a feed with a leftover amount).
  function compute(cat) {
    const events = [...cat.events].sort((a, b) => a.t - b.t);
    let level = 0;
    const rows = [];
    for (const e of events) {
      let eaten = null, discarded = 0;
      if (e.type === "feed") {
        if (e.leftover != null) {
          eaten = Math.max(0, level - e.leftover);
          level = e.leftover;
        }
        if (e.discard) { discarded = level; level = 0; }
        level += e.amount;
      } else if (e.type === "check") {
        eaten = Math.max(0, level - e.remaining);
        level = e.remaining;
        if (e.emptied) { discarded = level; level = 0; }
      }
      rows.push({ ...e, eaten, discarded, levelAfter: level });
    }
    return { rows, level };
  }

  function dailyTotals(cat, rows, days) {
    const map = {};
    for (const r of rows) {
      const k = catDay(r.t);
      map[k] = map[k] || { given: 0, eaten: 0, feeds: 0 };
      if (r.type === "feed") { map[k].given += r.amount; map[k].feeds++; }
      if (r.eaten != null) map[k].eaten += r.eaten;
    }
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(Date.now() - dayStartMs); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - i);
      const k = dayKey(d);
      out.push({ key: k, date: d, ...(map[k] || { given: 0, eaten: 0, feeds: 0 }) });
    }
    return out;
  }

  // ---------- Rendering ----------
  function bowlSVG(level, capacity) {
    const pct = capacity > 0 ? Math.max(0, Math.min(1, level / capacity)) : 0;
    const top = 70, bottom = 150, h = (bottom - top) * pct;
    return `
    <svg viewBox="0 0 240 170" role="img" aria-label="Bowl about ${Math.round(pct*100)}% full">
      <defs>
        <clipPath id="bowlClip"><path d="M30 70 H210 Q205 150 120 152 Q35 150 30 70 Z"/></clipPath>
        <pattern id="kib" width="14" height="10" patternUnits="userSpaceOnUse">
          <rect width="14" height="10" fill="var(--kibble)"/>
          <ellipse cx="4" cy="3" rx="3.2" ry="2.2" fill="#000" opacity=".13"/>
          <ellipse cx="11" cy="8" rx="3.2" ry="2.2" fill="#000" opacity=".13"/>
        </pattern>
      </defs>
      <ellipse cx="120" cy="160" rx="95" ry="7" fill="var(--line)"/>
      <g clip-path="url(#bowlClip)">
        <rect x="20" y="60" width="200" height="100" fill="var(--paper)"/>
        <rect id="food" x="20" y="${bottom - h}" width="200" height="${h + 4}" fill="url(#kib)"/>
      </g>
      <path d="M30 70 H210 Q205 150 120 152 Q35 150 30 70 Z" fill="none" stroke="var(--bowl)" stroke-width="7" stroke-linejoin="round"/>
      <rect x="22" y="62" width="196" height="12" rx="6" fill="var(--bowl)"/>
    </svg>`;
  }

  // days: [{date, given, eaten}], unitLabel: string, lines: [{v, color, dash}]
  function chartSVG(days, unitLabel, lines = [], label = "Daily chart") {
    const W = 640, H = 230, padL = 44, padR = 10, padT = 14, padB = 30;
    const maxVal = Math.max(1, ...lines.map(l => l.v), ...days.map(d => Math.max(d.given, d.eaten))) * 1.1;
    const n = days.length, bw = (W - padL - padR) / n;
    const y = v => padT + (H - padT - padB) * (1 - v / maxVal);
    const tick = v => (maxVal > 50 ? Math.round(v) : round(v)).toLocaleString();
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
    for (let i = 0; i <= 4; i++) {
      const v = maxVal / 1.1 * i / 4, yy = y(v);
      s += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>`;
      s += `<text x="${padL - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${tick(v)}</text>`;
    }
    const labelEvery = n > 14 ? 5 : n > 7 ? 2 : 1;
    days.forEach((d, i) => {
      const x = padL + i * bw;
      const gw = bw * 0.7, ew = bw * 0.44;
      const gx = x + (bw - gw) / 2, ex = x + (bw - ew) / 2;
      const tip = `${d.date.toLocaleDateString([], { month: "short", day: "numeric" })}: given ${tick(d.given)}, eaten ${tick(d.eaten)} ${unitLabel}`;
      s += `<g><title>${esc(tip)}</title>`;
      s += `<rect x="${gx}" y="${y(d.given)}" width="${gw}" height="${Math.max(0, y(0) - y(d.given))}" rx="3" fill="var(--kibble)" opacity=".35"/>`;
      s += `<rect x="${ex}" y="${y(d.eaten)}" width="${ew}" height="${Math.max(0, y(0) - y(d.eaten))}" rx="3" fill="var(--eaten)"/>`;
      s += `<rect x="${x}" y="${padT}" width="${bw}" height="${H - padT - padB}" fill="transparent"/></g>`;
      if ((n - 1 - i) % labelEvery === 0) {
        const lbl = n <= 7 ? d.date.toLocaleDateString([], { weekday: "short" }) : `${d.date.getMonth() + 1}/${d.date.getDate()}`;
        s += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${lbl}</text>`;
      }
    });
    for (const l of lines) {
      s += `<line x1="${padL}" x2="${W - padR}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.color}" stroke-width="2" stroke-dasharray="${l.dash}" opacity=".75"/>`;
    }
    return s + "</svg>";
  }

  // Daily calorie needs: resting energy (70 × kg^0.75) × lifestyle factor
  function kcalNeed(cat) {
    if (!cat.weight) return 0;
    const kg = cat.weightUnit === "kg" ? cat.weight : cat.weight * 0.4536;
    return 70 * Math.pow(kg, 0.75) * (cat.factor || 1.2);
  }
  const lineKey = (color, dash) => `<i style="background:none;border-top:2px dashed ${color};height:0;width:16px;vertical-align:3px;${dash === "2 3" ? "border-top-style:dotted;" : ""}"></i>`;

  function render() {
    const app = $("#app");
    const cat = activeCat();
    if (!cat) {
      app.innerHTML = `
        <div class="welcome">
          <div style="font-size:3rem">🐈</div>
          <h2>Start by adding your cat</h2>
          <p>Log each time you fill the bowl and weigh what's left, and you'll see how much they're really eating.</p>
          <button class="btn feed" id="firstCat">Add a cat</button>
          <p style="margin-top:28px"><button class="ghost" id="importBtn">Restore from a backup file</button></p>
        </div>`;
      $("#firstCat").onclick = () => openCatDlg(null);
      $("#importBtn").onclick = () => $("#importFile").click();
      return;
    }
    state.activeId = cat.id;
    dayStartMs = (cat.dayStart || 0) * 36e5;
    const { rows, level } = compute(cat);
    const range = state.range || 14;
    const tab = state.chartTab === "kcal" ? "kcal" : "food";
    const days = dailyTotals(cat, rows, range);
    const week = dailyTotals(cat, rows, 7);
    const today = week[week.length - 1];
    const weekEaten = week.reduce((a, d) => a + d.eaten, 0);
    const daysWithData = Math.max(1, week.filter(d => d.eaten > 0 || d.given > 0).length);
    const lastFeed = [...rows].reverse().find(r => r.type === "feed");
    const kpu = cat.kcal || 0;
    const need = kcalNeed(cat);
    const targetKcal = cat.target && kpu ? cat.target * kpu : 0;
    const kcalDays = days.map(d => ({ ...d, given: d.given * kpu, eaten: d.eaten * kpu }));
    const weekKcalAvg = weekEaten / daysWithData * kpu;
    // progress bar: toward calorie need if known, else toward daily target
    const pct = kpu && need ? today.eaten * kpu / need : cat.target ? today.eaten / cat.target : null;
    const progress = pct == null ? "" : `<div class="progress" title="${Math.round(pct * 100)}% of ${kpu && need ? "estimated calorie need" : "daily target"}"><i style="width:${Math.min(100, pct * 100)}%"></i></div>`;
    const capacity = Math.max(level, ...rows.filter(r => r.type === "feed").slice(-10).map(r => r.levelAfter), 1);

    // history grouped by day, newest first
    const recent = [...rows].reverse().slice(0, 60);
    const groups = [];
    for (const r of recent) {
      const k = catDay(r.t);
      if (!groups.length || groups[groups.length - 1].key !== k) groups.push({ key: k, items: [] });
      groups[groups.length - 1].items.push(r);
    }

    app.innerHTML = `
      <header>
        <div class="top">
          <h1>🐈 Food bowl</h1>
          <button class="ghost" id="editCat">Edit ${esc(cat.name)}</button>
        </div>
        <div class="cats" role="group" aria-label="Choose cat">
          ${state.cats.map(c => `<button class="cat-chip" data-cat="${c.id}" aria-pressed="${c.id === cat.id}">${esc(c.name)}</button>`).join("")}
          <button class="ghost" id="addCat">+ Add cat</button>
        </div>
      </header>

      <div class="hero">
        ${bowlSVG(level, capacity)}
        <div>
          <div class="level">${round(level).toLocaleString()} <small>${esc(unitFor(level, cat.unit))} in the bowl (estimate)</small></div>
          <p>${lastFeed ? `Last fed ${ago(lastFeed.t)} (${fmt(lastFeed.amount, cat)})` : "No feedings logged yet."}</p>
          <div class="actions">
            <button class="btn feed" id="feedBtn">Add food</button>
            <button class="btn check" id="checkBtn">Weigh leftovers</button>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><b>${fmt(today.eaten, cat)}</b>
          <span>eaten today${kpu ? ` (${Math.round(today.eaten * kpu).toLocaleString()}${need ? ` of ~${Math.round(need)}` : ""} kcal)` : ""}</span>
          ${progress}
        </div>
        <div class="stat"><b>${fmt(today.given, cat)}</b>
          <span>given today, ${today.feeds} feeding${today.feeds === 1 ? "" : "s"}</span></div>
        <div class="stat"><b>${fmt(weekEaten / daysWithData, cat)}</b>
          <span>daily average, last 7 days${kpu ? ` (${Math.round(weekKcalAvg).toLocaleString()} kcal)` : ""}</span></div>
        <div class="stat"><b>${fmt(weekEaten, cat)}</b>
          <span>eaten in the last 7 days</span></div>
      </div>

      <section class="panel">
        <div class="panel-head">
          <div class="tabs" role="tablist" aria-label="Chart">
            <button role="tab" id="tab-food" data-tab="food" aria-selected="${tab === "food"}" aria-controls="chartPanel" tabindex="${tab === "food" ? 0 : -1}">Daily food</button>
            <button role="tab" id="tab-kcal" data-tab="kcal" aria-selected="${tab === "kcal"}" aria-controls="chartPanel" tabindex="${tab === "kcal" ? 0 : -1}">Calories</button>
          </div>
          <div class="seg" role="group" aria-label="Chart range">
            ${[7, 14, 30].map(r => `<button data-range="${r}" aria-pressed="${r === range}">${r} days</button>`).join("")}
          </div>
        </div>
        <div id="chartPanel" role="tabpanel" aria-labelledby="tab-${tab}">
        ${tab === "food" ? `
          <div class="chart-wrap">${chartSVG(days, cat.unit, cat.target ? [{ v: cat.target, color: "var(--ink)", dash: "6 4" }] : [], "Food given and eaten per day")}</div>
          <div class="legend">
            <span><i style="background:var(--kibble);opacity:.5"></i>Given</span>
            <span><i style="background:var(--eaten)"></i>Eaten</span>
            ${cat.target ? `<span>${lineKey("var(--ink)", "6 4")}Daily target (${fmt(cat.target, cat)})</span>` : ""}
          </div>
        ` : kpu ? `
          <div class="chart-wrap">${chartSVG(kcalDays, "kcal", [
            ...(targetKcal ? [{ v: targetKcal, color: "var(--ink)", dash: "6 4" }] : []),
            ...(need ? [{ v: need, color: "var(--bowl)", dash: "2 3" }] : [])
          ], "Calories given and eaten per day")}</div>
          <div class="legend">
            <span><i style="background:var(--kibble);opacity:.5"></i>Given</span>
            <span><i style="background:var(--eaten)"></i>Eaten</span>
            ${targetKcal ? `<span>${lineKey("var(--ink)", "6 4")}Your target (${Math.round(targetKcal)} kcal)</span>` : ""}
            ${need ? `<span>${lineKey("var(--bowl)", "2 3")}Estimated need (${Math.round(need)} kcal)</span>` : ""}
          </div>
          ${need ? "" : `<p class="panel-note">Add ${esc(cat.name)}'s weight in “Edit ${esc(cat.name)}” to see their estimated daily need.</p>`}
        ` : `<p class="panel-note">Add calories per ${esc(unitSingular(cat.unit))} in “Edit ${esc(cat.name)}” to see calories eaten each day.</p>`}
        </div>
      </section>

      <section class="panel">
        <h2>History</h2>
        ${groups.length ? groups.map(g => `
          <div class="day"><h3>${dayLabel(g.key)}</h3>
            ${g.items.map(r => entryHTML(r, cat)).join("")}
          </div>`).join("") : `<div class="empty">Nothing logged yet. Tap “Add food” when you fill the bowl.</div>`}
      </section>

      <footer>
        ${backupNote()}
        <button class="ghost" id="exportBtn">Download backup</button>
        <button class="ghost" id="importBtn">Restore backup</button>
      </footer>`;

    // wire up
    app.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { state.activeId = b.dataset.cat; save(); render(); });
    const tabs = [...app.querySelectorAll("[data-tab]")];
    tabs.forEach((b, i) => {
      b.onclick = () => { state.chartTab = b.dataset.tab; save(); render(); $(`#tab-${state.chartTab}`).focus(); };
      b.onkeydown = e => {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length].click();
      };
    });
    app.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { state.range = +b.dataset.range; save(); render(); });
    app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      if (!confirm("Delete this entry?")) return;
      cat.events = cat.events.filter(e => e.id !== b.dataset.del); save(); render();
    });
    app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
      const ev = cat.events.find(e => e.id === b.dataset.edit);
      if (ev) openEntryDlg(ev.type === "feed" ? "#feedDlg" : "#checkDlg", ev);
    });
    $("#addCat").onclick = () => openCatDlg(null);
    $("#editCat").onclick = () => openCatDlg(cat);
    $("#feedBtn").onclick = () => openEntryDlg("#feedDlg");
    $("#checkBtn").onclick = () => openEntryDlg("#checkDlg");
    $("#exportBtn").onclick = exportData;
    $("#importBtn").onclick = () => $("#importFile").click();
  }

  function entryHTML(r, cat) {
    let color, title, detail = [];
    if (r.type === "feed") {
      color = "var(--kibble)"; title = `Added ${fmt(r.amount, cat)}`;
      if (r.leftover != null) detail.push(`${fmt(r.leftover, cat)} was left`);
      if (r.eaten != null) detail.push(`${fmt(r.eaten, cat)} eaten since last check`);
      if (r.discarded) detail.push(`${fmt(r.discarded, cat)} thrown out`);
    } else {
      color = "var(--eaten)"; title = `${fmt(r.remaining, cat)} left in bowl`;
      detail.push(`${fmt(r.eaten, cat)} eaten since last check`);
      if (r.emptied) detail.push(`leftovers thrown out`);
    }
    return `<div class="entry">
      <span class="dot" style="background:${color}"></span>
      <div class="txt">${title}${detail.length ? `<small>${detail.join(", ")}</small>` : ""}</div>
      <span class="time">${timeStr(r.t)}</span>
      <button data-edit="${r.id}" data-type="${r.type}" aria-label="Edit entry">Edit</button>
      <button data-del="${r.id}" aria-label="Delete entry">✕</button>
    </div>`;
  }

  // ---------- Dialogs ----------
  document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());

  let editingEntryId = null;
  function openEntryDlg(sel, entry) {
    const dlg = $(sel), form = dlg.querySelector("form");
    form.reset();
    editingEntryId = entry ? entry.id : null;
    form.elements.time.value = toLocalInput(entry ? entry.t : Date.now());
    if (sel === "#feedDlg") {
      $("#feedTitle").textContent = entry ? "Edit feeding" : "Add food";
      $("#feedSubmit").textContent = entry ? "Save changes" : "Add food";
      if (entry) {
        form.elements.amount.value = entry.amount;
        form.elements.leftover.value = entry.leftover ?? "";
        form.elements.discard.checked = !!entry.discard;
      }
    } else {
      $("#checkTitle").textContent = entry ? "Edit leftovers" : "Weigh leftovers";
      if (entry) {
        form.elements.remaining.value = entry.remaining;
        form.elements.emptied.checked = !!entry.emptied;
      }
    }
    dlg.querySelectorAll(".unit").forEach(u => u.textContent = activeCat().unit);
    dlg.showModal();
    const first = form.querySelector("input[type=number]");
    first && first.focus();
  }

  function saveEntry(cat, data) {
    const existing = editingEntryId && cat.events.find(e => e.id === editingEntryId);
    if (existing) Object.assign(existing, data);
    else cat.events.push({ id: uid(), ...data });
    editingEntryId = null;
  }

  $("#feedForm").addEventListener("submit", e => {
    const f = e.target, cat = activeCat();
    const amount = parseFloat(f.elements.amount.value);
    if (!(amount >= 0)) { e.preventDefault(); return; }
    const lo = f.elements.leftover.value.trim();
    saveEntry(cat, {
      type: "feed", t: new Date(f.elements.time.value).getTime() || Date.now(),
      amount, leftover: lo === "" ? null : parseFloat(lo), discard: f.elements.discard.checked
    });
    save(); render();
  });

  $("#checkForm").addEventListener("submit", e => {
    const f = e.target, cat = activeCat();
    const remaining = parseFloat(f.elements.remaining.value);
    if (!(remaining >= 0)) { e.preventDefault(); return; }
    saveEntry(cat, {
      type: "check", t: new Date(f.elements.time.value).getTime() || Date.now(),
      remaining, emptied: f.elements.emptied.checked
    });
    save(); render();
  });

  let editingCatId = null;
  function updateUnitNames() {
    const u = $("#catForm").elements.unit.value;
    const spans = $("#catForm").querySelectorAll(".unitName");
    spans[0].textContent = unitPlural(u);
    spans[1].textContent = unitSingular(u);
  }
  $("#catForm").elements.unit.addEventListener("change", updateUnitNames);
  function openCatDlg(cat) {
    const dlg = $("#catDlg"), f = $("#catForm");
    f.reset();
    editingCatId = cat ? cat.id : null;
    $("#catDlgTitle").textContent = cat ? `Edit ${cat.name}` : "Add a cat";
    $("#deleteCatBtn").hidden = !cat;
    if (cat) {
      f.elements.name.value = cat.name; f.elements.unit.value = cat.unit; f.elements.target.value = cat.target || "";
      f.elements.kcal.value = cat.kcal || ""; f.elements.weight.value = cat.weight || "";
      f.elements.weightUnit.value = cat.weightUnit || "lb"; f.elements.factor.value = String(cat.factor || 1.2);
      f.elements.dayStart.value = String(cat.dayStart || 0);
    }
    updateUnitNames();
    dlg.showModal();
    f.elements.name.focus();
  }
  $("#catForm").addEventListener("submit", e => {
    const f = e.target;
    const name = f.elements.name.value.trim();
    if (!name) { e.preventDefault(); return; }
    const fields = {
      name, unit: f.elements.unit.value,
      target: parseFloat(f.elements.target.value) || 0,
      kcal: parseFloat(f.elements.kcal.value) || 0,
      weight: parseFloat(f.elements.weight.value) || 0,
      weightUnit: f.elements.weightUnit.value,
      factor: parseFloat(f.elements.factor.value) || 1.2,
      dayStart: parseInt(f.elements.dayStart.value, 10) || 0
    };
    if (editingCatId) {
      Object.assign(state.cats.find(c => c.id === editingCatId), fields);
    } else {
      const c = { id: uid(), ...fields, events: [] };
      state.cats.push(c); state.activeId = c.id;
    }
    save(); render();
  });
  $("#deleteCatBtn").onclick = () => {
    const c = state.cats.find(c => c.id === editingCatId);
    if (!c || !confirm(`Delete ${c.name} and all of their history? This can't be undone.`)) return;
    state.cats = state.cats.filter(x => x.id !== c.id);
    state.activeId = state.cats[0]?.id || null;
    $("#catDlg").close(); save(); render();
  };

  // ---------- Backup ----------
  // Data only lives in this browser, so nudge toward a backup every 30 days.
  function backupNote() {
    if (!state.cats.some(c => c.events.length)) return "";
    const last = state.lastBackup;
    if (!last || Date.now() - last > 30 * 864e5) {
      return `<p class="backup-warn"><b>Last backup: ${last ? ago(last) : "never"}.</b> Your log is only saved in this browser, so download a backup now and then.</p>`;
    }
    return `<p class="footer-note">Last backup ${ago(last)}</p>`;
  }

  function exportData() {
    state.lastBackup = Date.now(); save();
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `cat-food-backup-${dayKey(Date.now())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    render();
  }
  $("#importFile").addEventListener("change", async e => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.cats)) throw new Error("not a backup");
      if (!confirm("Replace everything in this browser with the backup?")) return;
      state = data; save(); render();
    } catch {
      alert("That file isn't a backup from this app. Choose a .json file made with “Download backup”.");
    }
  });

  // refresh "x min ago" every minute
  setInterval(() => { if (!document.querySelector("dialog[open]")) render(); }, 60000);
  // Home-screen install / offline support
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(e => console.warn("Service worker not registered", e));
  }
  // Ask the browser not to clear this site's storage when space runs low
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  render();
})();
</script>
</body>
</html>
